<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="title-bar">
    <h1 class="title" aria-label="Tetris">
      <span style="--c:#4dd0e1">T</span><span style="--c:#ffd54f">E</span><span style="--c:#ba68c8">T</span><span style="--c:#81c784">R</span><span style="--c:#e57373">I</span><span style="--c:#ffb74d">S</span>
    </h1>
    <p class="subtitle" id="subtitle"></p>
  </header>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-btn" type="button" title="Cambiar tema (T)">Clásico</button>
          <span id="theme-joke" class="joke"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> silenciar</li>
            <li><kbd>T</kbd> cambiar tema</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <footer class="credits">
    Gracias a nuestros colaboradores:
    <a href="https://github.com/gaboxin/claude-tetris" target="_blank" rel="noopener">gaboxin</a> (fork) y
    <a href="https://github.com/anthropics/claude-code" target="_blank" rel="noopener">Claude</a>
  </footer>

  <script src="themes.js"></script>
  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
